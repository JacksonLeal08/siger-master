<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E8289"/>
      <stop offset="50%" stop-color="#282A2F"/>
      <stop offset="100%" stop-color="#1E2024"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7F365"/>
      <stop offset="100%" stop-color="#68D346"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Fundo Metal Titânio -->
  <rect width="100" height="100" rx="22" fill="#1E2024" stroke="url(#metalRim)" stroke-width="3"/>
  <!-- Ícone Cyber Glow Verde Neon -->
  <g filter="url(#glow)">
    <path d="M 28,26 L 72,26 L 72,36 L 56,36 L 56,66 C 56,73 50,78 42,78 C 34,78 30,73 30,66 L 40,66 C 40,68 41,70 43,70 C 45,70 46,68 46,65 L 46,36 L 28,36 Z" fill="url(#neonGreen)"/>
    <circle cx="68" cy="68" r="5" fill="#B7F365"/>
  </g>
</svg>
