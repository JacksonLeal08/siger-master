<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2024" />
      <stop offset="100%" stop-color="#141619" />
    </linearGradient>

    <!-- Titanium Sheen Gradient -->
    <linearGradient id="titaniumLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D5D9DC" />
      <stop offset="50%" stop-color="#7E8289" />
      <stop offset="100%" stop-color="#55585E" />
    </linearGradient>

    <linearGradient id="titaniumRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E8289" />
      <stop offset="60%" stop-color="#3C3F45" />
      <stop offset="100%" stop-color="#282A2F" />
    </linearGradient>

    <linearGradient id="innerCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2228" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>

    <!-- Cyber Neon Glows -->
    <radialGradient id="neonBacklight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B7F365" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#68D346" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#1C4E26" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1E2024" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7F365" />
      <stop offset="100%" stop-color="#68D346" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- 1. Background Surface -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- 2. Cyber Circuit Grid Texture (Subtle) -->
  <g opacity="0.08" stroke="#D5D9DC" stroke-width="1">
    <path d="M 0 64 H 512 M 0 128 H 512 M 0 192 H 512 M 0 256 H 512 M 0 320 H 512 M 0 384 H 512 M 0 448 H 512" />
    <path d="M 64 0 V 512 M 128 0 V 512 M 192 0 V 512 M 256 0 V 512 M 320 0 V 512 M 384 0 V 512 M 448 0 V 512" />
  </g>

  <!-- 3. Ambient Backlight Neon Glow -->
  <circle cx="256" cy="256" r="170" fill="url(#neonBacklight)" />

  <!-- 4. Tactical Chamfered Shield with Shadow -->
  <g filter="url(#shadowFilter)">
    <!-- Base Outer Shield -->
    <!-- Points: Top-center, top-right chamfer, shoulder, mid curve, bottom tip, etc. -->
    <path d="M 256 90 L 370 90 L 392 112 L 392 230 L 330 330 L 256 420 L 182 330 L 120 230 L 120 112 L 142 90 Z" 
          fill="url(#titaniumRight)" stroke="#3C3F45" stroke-width="2" />
    
    <!-- Left Facet (Specular Highlight) -->
    <path d="M 256 90 L 142 90 L 120 112 L 120 230 L 182 330 L 256 420 Z" 
          fill="url(#titaniumLeft)" />

    <!-- Top Bezel Specular Sheen (Titanium #D5D9DC) -->
    <path d="M 142 92 L 370 92" stroke="#D5D9DC" stroke-width="4" stroke-linecap="round" />

    <!-- Inner Recessed Core -->
    <path d="M 256 122 L 348 122 L 366 140 L 366 230 L 314 316 L 256 388 L 198 316 L 146 230 L 146 140 L 164 122 Z" 
          fill="url(#innerCore)" stroke="url(#neonLine)" stroke-width="3" filter="url(#glowEffect)" />
  </g>

  <!-- 5. Cyber Circuits & Sensor Nodes -->
  <g stroke="#68D346" stroke-width="2.5" fill="none" opacity="0.9">
    <path d="M 170 190 H 205 L 222 212" />
    <circle cx="222" cy="212" r="3.5" fill="#B7F365" stroke="none" />
    
    <path d="M 342 190 H 307 L 290 212" />
    <circle cx="290" cy="212" r="3.5" fill="#B7F365" stroke="none" />

    <path d="M 256 388 V 355" />
    <circle cx="256" cy="355" r="3" fill="#B7F365" stroke="none" />
  </g>

  <!-- 6. Stylized Star of Life / Rapid Intervention Core -->
  <g transform="translate(256, 250)">
    <!-- 6-point Star Arms -->
    <g fill="#D5D9DC" stroke="#68D346" stroke-width="2">
      <!-- Vertical arm -->
      <rect x="-11" y="-58" width="22" height="116" rx="6" />
      <!-- 60 deg rotated arm -->
      <rect x="-11" y="-58" width="22" height="116" rx="6" transform="rotate(60)" />
      <!-- 120 deg rotated arm -->
      <rect x="-11" y="-58" width="22" height="116" rx="6" transform="rotate(120)" />
    </g>

    <!-- Tactical Core Flame (Intervenção Rápida) -->
    <path d="M 0 -42 C 18 -10, 20 18, 9 32 C 3 40, -3 40, -9 32 C -20 18, -18 -10, 0 -42 Z" 
          fill="url(#neonLine)" filter="url(#glowEffect)" />
    <path d="M 0 -22 C 8 -2, 9 12, 4 20 C 1 24, -1 24, -4 20 C -9 12, -8 -2, 0 -22 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- 7. Outer Protective Border -->
  <rect x="4" y="4" width="504" height="504" rx="104" fill="none" stroke="#3C3F45" stroke-width="3" opacity="0.6" />
</svg>
